---
gpg_keys:
  - name: "1Password"
    url: "https://downloads.1password.com/linux/keys/1password.asc"
    output: "/tmp/1password.asc"

builder: # used to install AUR packages
  account: aur_builder
  sudoer_file: "/etc/sudoers.d/10-{{ builder.account }}-aur-privileges"
  tmp_build_tool_directory: "/home/{{ builder.account }}/yay-bin"

packages:
  repo:
    - bat
    - git
    - curl
  aur:
    - 1password
    - 1password-cli
  flatpak:
    - org.gnome.meld
