---
- name: Bootstrap Machine
  hosts: localhost, all
  become: true
  gather_facts: true
  vars:
    dotfiles_user: "{{ ansible_facts['env'].SUDO_USER | default(lookup('env', 'USER')) }}"

  pre_tasks:
    - name: "Init: inject 'All' variables"
      ansible.builtin.include_vars:
        file: "group_vars/all.yml"
      tags:
        - always

    - name: "Init: inject 'Linux' variables"
      when: ansible_facts['system'] == "Linux"
      ansible.builtin.include_vars:
        file: "group_vars/linux.yml"
      tags:
        - always

    - name: "Init: inject 'Arch Linux' variables"
      when: ansible_facts['distribution'] == "Archlinux"
      ansible.builtin.include_vars:
        file: "group_vars/aur.yml"
      tags:
        - always

    - name: "Check: desktop environment"
      when: ansible_facts['system'] == "Linux"
      ansible.builtin.stat:
        path: /usr/bin/gnome-shell
      register: gnome_check
      tags:
        - always

  roles:
    - name: bootstrap_dependencies
      tags:
        - bootstrap
        - deps

    - name: yay_installer
      tags:
        - yay
        - installer
        - arch

    - name: pacman_packages
      tags:
        - pacman
        - apps
        - arch
        - native

    - name: aur_packages
      tags:
        - aur
        - apps
        - arch

    - name: flatpak_packages
      tags:
        - flatpak
        - apps

    - name: fancy_shell
      tags:
        - shell
        - console
        - cli

    - name: linux_setup
      when:
        - ansible_facts['system'] == "Linux"
      tags:
        - linux
        - desktop_environment
        - os

    - name: gnome_setup
      when:
        - ansible_facts['system'] == "Linux"
        - gnome_check.stat.exists
      tags:
        - gnome
        - desktop_environment
